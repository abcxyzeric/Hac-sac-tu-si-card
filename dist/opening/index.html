Không"],"region":"Phía tây Tây Mạc","type":"Bí cảnh","color":"#8a7fd1","description":"Cổ thành không người trôi trong khe nứt không gian ngoài biển Tây Mạc. Kiến trúc không thuộc bất kỳ thời đại đã biết nào, trong thành thỉnh thoảng có di vật giống khoa kỹ dị giới.","x":11.99,"y":55.46},{"name":"U Minh Uyên","aliases":["Minh Uyên"],"region":"Biển Vô Tận đông nam","type":"Cấm địa","color":"#b05b7a","description":"Vực sâu không đáy ngoài biển giữa Đông Hoang và Nam Lĩnh, từ thượng cổ đã bị liệt vào cấm địa Thiên giai. Truyền rằng trong vực chôn giấu vô số linh thạch.","x":87.49,"y":86.69},{"name":"Bí cảnh Kiếm Khư","aliases":["Kiếm Khư"],"region":"Miền tây Trung Châu","type":"Bí cảnh","color":"#79a8b8","description":"Nơi táng kiếm của đại năng kiếm tu thái cổ, vạn kiếm ngủ yên tại đây. Bí cảnh nằm gần Thái Hư Kiếm Tông, mỗi tháng mở một lần.","x":37.73,"y":49.86},{"name":"Vạn Yêu Lâm","aliases":["Yêu Vương Đình"],"region":"Đông Hoang","type":"Lãnh địa yêu tộc","color":"#5f9b68","description":"Lãnh địa lõi của yêu tộc nơi sâu trong Đông Hoang, Yêu Vương Đình tọa lạc tại đó. Dưới Yêu Vương, ba đại bộ tộc chia trị rừng biển; vào trong phải tuân thủ quy củ yêu tộc.","x":71.52,"y":59.88},{"name":"Lãnh địa Morga","aliases":["Ốc đảo Morga","Ốc đảo"],"region":"Tây Mạc","type":"Lãnh địa Cổ Thần","color":"#d08a68","description":"Ốc đảo trung lập phía bắc khe nứt Thiên Uyên, do Cổ Thần Morga bảo hộ. Nơi này cấm chiến hỏa, nô dịch, huyết tế và thờ phụng Cựu Nhật, đồng thời là nơi che chở khi ô nhiễm tràn ra ngoài.","x":26.5,"y":37.08},{"name":"Huyền Băng Cung","aliases":["Băng Cung"],"region":"Bắc Minh","type":"Tông môn chính đạo","color":"#75b9cf","description":"Đại tông duy nhất của Bắc Minh, môn nhân chuyên tu công pháp hệ băng. Tông môn xây dựa vào cô thành băng sơn, lâu dài cách biệt với đời, hành sự thần bí kín tiếng.","x":48.62,"y":21.07},{"name":"Huyền Băng Thành","aliases":["Huyền Băng Thành Bắc Minh"],"region":"Bắc Minh","type":"Thành trì","color":"#75b9cf","description":"Cô thành Bắc Minh xây dựa vào băng sơn nơi Huyền Băng Cung tọa lạc, cũng là một trong số ít thành lớn ở Bắc Minh có cư dân ở lâu dài.","x":46.75,"y":22.05},{"name":"Thiên Kinh Thành","aliases":["Thiên Kinh","Đô thành Đại Ngu"],"region":"Kinh kỳ Trung Châu","type":"Đô thành","color":"#d2ad5f","description":"Đô thành Đại Ngu và thành lớn nhất đại lục, phàm thành khu và linh thành khu cùng tồn tại. Tổng bộ Vạn Tượng Phường và Linh Đài Ty đều đặt tại đây, là trung tâm thương lộ và quyền lực của năm vực.","x":49.61,"y":53.64},{"name":"Vân Tụ Châu","aliases":["Vân Tụ"],"region":"Miền tây Trung Châu","type":"Châu vực","color":"#7fa9a0","description":"Châu hậu cần tiền tuyến sát cửa ải Thiên Uyên. Phường thị Vân Tụ là điểm tiếp tế lớn nhất trong quan nội, sơn môn Trấn Nhạc Tông nằm ở tây nam châu cảnh.","x":46.71,"y":41.97},{"name":"Lâm Giang Châu","aliases":["Lâm Giang"],"region":"Miền nam Trung Châu","type":"Châu vực","color":"#6f9fc2","description":"Trọng trấn vận tải thủy và lương thuế ở miền nam Trung Châu. Lâm Giang Quan khống chế thủy lộ đi Nam Lĩnh, các thủy bang bến cảng chiếm giữ, tin tức qua lại cực nhanh.","x":44.58,"y":63.55},{"name":"Đông Bình Châu","aliases":["Đông Bình","Đông Bình Châu"],"region":"Miền đông Trung Châu","type":"Châu vực","color":"#c8a267","description":"Châu đệm từ Trung Châu đi Đông Hoang, phàm nhân tụ cư đông đúc, cũng là nơi đặt mã chính của Đại Ngu. Sơn môn Vạn Pháp Môn nằm ở phía nam châu cảnh.","x":60.46,"y":56.17},{"name":"Hà Sóc Châu","aliases":["Hà Sóc"],"region":"Miền bắc Trung Châu","type":"Châu vực","color":"#a58d72","description":"Vùng sản xuất hàn thiết gần Bắc Minh, quanh năm có biên quân đóng giữ để chống yêu thú nam hạ. Sơn môn Bích Lạc Cung nằm ở Dược Vương Cốc phía nam châu cảnh.","x":59.84,"y":41.54},{"name":"Cửa ải Thiên Uyên","aliases":["Cửa ải Thiên Uyên","Ngoài cửa ải Thiên Uyên"],"region":"Ranh giới Trung Châu và Tây Mạc","type":"Cửa ải","color":"#c77a52","description":"Cực tây của cương giới danh nghĩa Đại Ngu, cũng là tiền tuyến đối đầu chính ma. Thương đội, người đào vong và các tuyến buôn lậu xám tụ về đây.","x":36.61,"y":38.8},{"name":"Bách Thảo Thành","aliases":["Bách Thảo"],"region":"Nam Lĩnh","type":"Thành trì","color":"#7da66a","description":"Thành tụ tán dược liệu lớn nhất Nam Lĩnh. Trên danh nghĩa thuộc Đại Ngu, nhưng thuế quan, thành phòng và luật pháp thực tế đều do Đan Hà Tông nắm giữ.","x":55.9,"y":76.53},{"name":"Thanh Mộc Thành","aliases":["Thanh Mộc"],"region":"Miền tây Đông Hoang","type":"Thành trì","color":"#67976e","description":"Đứng đầu bảy nước chư hầu, cũng là nơi tụ tán chính của tán tu săn yêu. Trong thành thịnh hành giao dịch vật liệu yêu thú và linh thảo.","x":70.96,"y":46.38},{"name":"Cảng cá Bắc Hải","aliases":["Cảng Bắc Hải","Cảng cá"],"region":"Ven Bắc Hải của Bắc Minh","type":"Cảng","color":"#5f91ad","description":"Cảng cá tự trị hiếm hoi có cư dân ở Bắc Minh. Nơi đây không có quan phủ và thuế khóa, cư dân bầu trưởng giả phân xử tranh chấp, dân phong chất phác mà khép kín.","x":68.09,"y":17.04},{"name":"Làng chài bỏ hoang của Cthylla","aliases":["Làng hoang Cthylla","Làng chài bỏ hoang","Nơi canh giữ đèn triều"],"region":"Ven Bắc Hải của Bắc Minh","type":"Khu quản chế","color":"#708493","description":"Trạm cách ly ô nhiễm Cựu Nhật và điểm canh giữ đèn triều phía bắc cảng cá Bắc Hải. Dưới làng vẫn còn khe nứt ô nhiễm, chưa được Thiên Cơ Các hoặc Huyền Băng Cung cho phép thì không được vào.","x":64.76,"y":14.64},{"name":"???","aliases":[],"region":"Bắc Minh","type":"Địa điểm chưa rõ","color":"#929292","description":"Điểm đánh dấu chưa đặt tên trên băng nguyên Bắc Minh. Ghi chép hiện có chưa đủ, tính chất và cấp độ nguy hiểm đều cần xác nhận thêm.","x":62.67,"y":23.09},{"name":"Đạo quán của Sphinx","aliases":["Đạo quán Sphinx","Đạo quán bỏ hoang"],"region":"Dãy núi Nam Lĩnh","type":"Nơi ở Cổ Thần","color":"#9a83b8","description":"Đạo quán bỏ hoang ở rìa khu quản hạt Đan Hà Tông, Cổ Thần Sphinx đã ẩn cư tại đây hai trăm năm. Năng lực của nàng chủ yếu dùng để trấn an và cách ly ô nhiễm tinh thần.","x":35.96,"y":75.26},{"name":"Lô Sơn Trấn","aliases":["Lô Sơn"],"region":"Nam Lĩnh","type":"Thành trấn","color":"#c8794b","description":"Thành trấn tự trị của luyện khí sư, không thuộc bất kỳ tông môn nào, nổi tiếng với câu "người không nhóm lò thì không nộp thuế"; là lựa chọn đầu tiên để tán tu luyện khí sư đặt chân học nghề.","x":59.83,"y":68.33},{"name":"Thiên Cơ Các","aliases":["Thiên Cơ"],"region":"Rìa nam Trung Châu","type":"Tông môn chính đạo","color":"#7380b8","description":"Tinh nghiên trận pháp và thuật suy diễn, tự xưng tính hết thiên cơ. Thiên Cơ Các cất giữ điển tịch đầy đủ nhất tu tiên giới, tọa lạc gần ranh giới Trung Châu và Nam Lĩnh.","x":35.15,"y":70.04},{"name":"Thái Hư Kiếm Tông","aliases":["Thái Hư","Kiếm Tông","Thương Vân Phong","Dưới núi Thái Hư Kiếm Tông"],"region":"Miền tây Trung Châu","type":"Tông môn chính đạo","color":"#8fa9bd","description":"Tổ đình kiếm tu trong thiên hạ, nổi danh tu tiên giới bằng Thái Hư Kiếm Quyết. Sơn môn đặt ở Thương Vân Phong miền tây Trung Châu, gần đó chính là bí cảnh Kiếm Khư.","x":39.49,"y":49.75},{"name":"Bích Lạc Cung","aliases":["Bích Lạc","Dược Vương Cốc"],"region":"Đông bắc Trung Châu","type":"Tông môn chính đạo","color":"#70a894","description":"Tông môn chính đạo lấy y đạo nhập thế, hành y cứu đời, nắm giữ thuật trị thương nối mệnh đứng đầu. Sơn môn nằm ở Dược Vương Cốc phía nam Hà Sóc Châu.","x":61.32,"y":47.5},{"name":"Thành bang cộng trị Nhân - Yêu","aliases":["Thành bang cộng trị","Thành bang Nhân - Yêu"],"region":"Vùng đệm Đông Hoang","type":"Thành bang","color":"#6da58f","description":"Thành bang thương mại do người lai hai tộc dựng nên và do Nhân tộc cùng Yêu tộc quản lý, là một trong số ít đầu mối tình báo và thương mại có trật tự bình hòa ở Đông Hoang.","x":66.72,"y":49.55},{"name":"Vạn Pháp Môn","aliases":["Vạn Pháp","Vạn Pháp Sơn"],"region":"Đông nam Trung Châu","type":"Tông môn chính đạo","color":"#7e86c5","description":"Thánh địa nghiên cứu pháp thuật, cất giữ công pháp bí tịch đủ chủng loại nhất. Tông môn chủ trương vạn pháp quy tông, kiêm dung rộng nạp; sơn môn nằm ở phía nam Đông Bình Châu.","x":62.45,"y":59.27},{"name":"Trấn Nhạc Tông","aliases":["Trấn Nhạc","Thiết Nhạc"],"region":"Tây bắc Trung Châu","type":"Tông môn chính đạo","color":"#a8875e","description":"Chính thống thể tu, lấy nhục thân đối kháng trời đất. Môn nhân tuy ít nhưng chiến lực kinh người, sơn môn nằm trong dãy Thiết Nhạc phía tây nam Vân Tụ Châu.","x":39.72,"y":38.37},{"name":"Vạn Tượng Ma Tông","aliases":["Khu quản hạt Vạn Tượng Ma Tông","Ma tông"],"region":"Miền đông Tây Mạc","type":"Tông môn ma đạo","color":"#875a9e","description":"Chủ trương lấy ma chứng đạo, cho rằng ma đạo cũng có thể thông tới đại đạo. Tông môn hành sự cực đoan nhưng không lấy giết bừa làm chuẩn, duy trì trật tự một phương ngoài cửa ải Thiên Uyên.","x":32.53,"y":57.28},{"name":"U Hồn Cốc","aliases":["Khu quản hạt U Hồn Cốc"],"region":"Tây Mạc","type":"Tông môn ma đạo","color":"#7d6a9d","description":"Tông môn ma đạo tinh thông bí thuật thần hồn và luyện chế khôi lỗi, giỏi sai khiến người chết. Nghe nói cốc chủ đã tồn thế năm nghìn năm.","x":18.79,"y":53.52},{"name":"Huyết Sát Tông","aliases":["Khu quản hạt Huyết Sát Tông"],"region":"Tây Mạc","type":"Tông môn ma đạo","color":"#b64f55","description":"Tông môn ma đạo dùng phép huyết luyện để nhanh chóng tăng tu vi, bị chính đạo xem là công địch. Tông môn hành sự tàn nhẫn, nhưng dùng môn quy nghiêm khắc ràng buộc môn nhân.","x":18.8,"y":36.98},{"name":"Đan Hà Tông","aliases":["Đan Hà","Đan Hà Sơn"],"region":"Nam Lĩnh","type":"Tông môn chính đạo","color":"#c96f57","description":"Đệ nhất tông luyện đan của tu tiên giới, nắm giữ rất nhiều pháp môn luyện đan cao cấp và thực tế khống chế Bách Thảo Thành. Có lợi ích sâu dày qua lại với các đại tông môn.","x":40.2,"y":82.21},{"name":"Bí cảnh Đan Hỏa","aliases":["Đan Hỏa"],"region":"Nam Lĩnh","type":"Bí cảnh","color":"#d65d48","description":"Bí cảnh Địa giai do địa h
